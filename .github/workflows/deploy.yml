name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            set -e

            cd /opt/apps/Medical-AI

            # Backup server-only config files before git reset
            cp app/docker/docker-compose.yaml /tmp/docker-compose.yaml.bak 2>/dev/null || true
            cp web/nginx.local.conf /tmp/nginx.local.conf.bak 2>/dev/null || true

            git fetch origin
            git reset --hard origin/main

            # Restore server-only config files after git reset
            cp /tmp/docker-compose.yaml.bak app/docker/docker-compose.yaml 2>/dev/null || true
            cp /tmp/nginx.local.conf.bak web/nginx.local.conf 2>/dev/null || true

            cd web
            npm ci
            npm run build

            cd ../app/docker
            docker compose up -d --build

            docker image prune -f
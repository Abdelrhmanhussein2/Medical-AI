version: "3.9"


services:
  postgres:
    image: postgres:16-alpine
    container_name: medical_ai_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - medical_postgres_data:/var/lib/postgresql/data
      - ../models/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medical_ai_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-your-secret-key-here}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=evolution_api
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - LOG_LEVEL=ERROR
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://backend:8000/api/v1/whatsapp/webhook
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: medical_ai_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - EVOLUTION_API_URL=http://evolution-api:8080
    ports:
      - "8000:8000"
    volumes:
      - medical_uploads_data:/workspace/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: nginx:alpine
    container_name: medical_ai_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ../../web/dist:/usr/share/nginx/html
      - ../../web/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  medical_postgres_data:
  medical_uploads_data:

